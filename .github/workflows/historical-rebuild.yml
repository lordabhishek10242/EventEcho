name: Historical Rebuild

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "results/event_master.csv"
      - "requirements.txt"
      - ".github/workflows/historical-rebuild.yml"

permissions:
  contents: read

jobs:
  acquire-analyze-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run network-free tests
        run: python -m pytest -q
      - name: Acquire frozen snapshot, rebuild analysis, and create dashboard
        run: |
          python scripts/rebuild_historical.py \
            --snapshot-id "eventecho-historical-${{ github.run_id }}" \
            --output-dir results/reproduced
      - name: Upload snapshot, tables, manifest, and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventecho-historical-rebuild-${{ github.run_id }}
          path: |
            data/snapshots/eventecho-historical-${{ github.run_id }}/
            results/reproduced/
          if-no-files-found: warn
          retention-days: 7
