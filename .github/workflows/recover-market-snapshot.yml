name: Recover frozen market snapshot

on:
  # Keep the dashboard and frozen-price analysis synchronized with material
  # changes to the event registry or analysis methodology.
  push:
    branches: ["main"]
    paths:
      - "results/event_master.csv"
      - "src/config.py"
      - "src/data.py"
      - "src/event_study.py"
      - "src/statistics.py"
      - "src/sensitivity.py"
      - "src/event_audit.py"
      - "src/reporting.py"
      - "scripts/run_analysis.py"
      - "scripts/acquire_market_snapshot.py"
      - ".github/workflows/recover-market-snapshot.yml"
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: "Filename-safe snapshot ID"
        required: true
        default: "eventecho_historical_2016_2025"
        type: string

permissions:
  contents: read

concurrency:
  group: eventecho-snapshot-${{ inputs.snapshot_id || 'eventecho_historical_2016_2025' }}
  cancel-in-progress: false

jobs:
  acquire-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run network-free tests
        run: python -m pytest -q

      - name: Acquire and validate historical prices
        id: acquire
        continue-on-error: true
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id || 'eventecho_historical_2016_2025' }}
        run: |
          python scripts/acquire_market_snapshot.py --snapshot-id "$SNAPSHOT_ID"
          python - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path("data/snapshots") / os.environ["SNAPSHOT_ID"] / "manifest.json"
          if not path.is_file():
              print(f"Snapshot manifest not found: {path}", file=sys.stderr)
              raise SystemExit(2)
          manifest = json.loads(path.read_text(encoding="utf-8"))
          print("Snapshot status:", manifest.get("status"))
          print("Classification:", manifest.get("classification"))
          print("Provider failures:", len(manifest.get("provider_failures", [])))
          if manifest.get("status") != "complete" or manifest.get("classification") != "historical_market_data":
              raise SystemExit("Refusing to analyze/package an incomplete or unclassified snapshot")
          PY

      - name: Package frozen snapshot
        if: steps.acquire.outcome == 'success'
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          tar -czf "${SNAPSHOT_ID}.tar.gz" -C data/snapshots "$SNAPSHOT_ID"
          sha256sum "${SNAPSHOT_ID}.tar.gz" > "${SNAPSHOT_ID}.tar.gz.sha256"

      - name: Run offline event study
        if: steps.acquire.outcome == 'success'
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          python scripts/run_analysis.py \
            --snapshot-id "$SNAPSHOT_ID" \
            --offline \
            --output-dir results/real_market_analysis \
            --verbose

      - name: Build interactive demo
        if: steps.acquire.outcome == 'success'
        run: |
          python scripts/build_demo.py \
            --analysis-dir results/real_market_analysis \
            --output results/real_market_analysis/eventecho_demo.html

      - name: Re-run tests after analysis
        if: steps.acquire.outcome == 'success'
        run: python -m pytest -q

      - name: Upload snapshot and analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventecho-recovery-${{ inputs.snapshot_id || 'eventecho_historical_2016_2025' }}
          path: |
            ${{ inputs.snapshot_id }}.tar.gz
            ${{ inputs.snapshot_id }}.tar.gz.sha256
            data/snapshots/${{ inputs.snapshot_id }}/manifest.json
            data/snapshots/${{ inputs.snapshot_id }}/validation.json
            results/real_market_analysis/
          if-no-files-found: warn
          retention-days: 7
